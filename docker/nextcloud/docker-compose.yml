services:
  db:
    image: mariadb:10.11
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --log-bin-trust-function-creators=1
    restart: unless-stopped
    volumes:
      - /data/nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-CHANGE_THIS_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-CHANGE_THIS_USER_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    volumes:
      - /data/nextcloud/redis:/data

  app:
    image: nextcloud:latest
    container_name: nextcloud-app
    restart: unless-stopped
    # Só no gateway do bridge do Docker: o único caminho é o túnel
    # (cloud.ebls.com.br -> 172.17.0.1:8085). Este arquivo dizia "8085:80"
    # enquanto o servidor já rodava assim — conferido em 01/11/2026.
    ports:
      - "172.17.0.1:8085:80"
    depends_on:
      - db
      - redis
    volumes:
      - /data/nextcloud/app:/var/www/html
      - /data/nextcloud/data:/var/www/html/data
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-CHANGE_THIS_USER_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - REDIS_HOST=redis
