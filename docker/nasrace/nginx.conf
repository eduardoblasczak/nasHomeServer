# NasRace: site estático mais a leitura do nas-pulse pela mesma origem.
# O navegador nunca fala direto com o nas-pulse: assim não há CORS nem endereço fixo no código.
# Público em https://ebls.com.br/nasrace/: o túnel só entrega aqui o que começa com /nasrace.

map $uri $nasrace_cache {
    # Revalida pelo ETag: os arquivos não têm hash no nome. Sem o `private`, a Cloudflare trocaria o
    # no-cache por 4 h de cache no navegador, e uma correção demoraria a chegar a quem já abriu a tela.
    default    "private, no-cache";
    /api/pulse "no-store";
    # Pesados e quase imutáveis: a Cloudflare guarda uma cópia e poupa o upload de casa.
    ~^/(textures|vendor|fonts|brands)/ "public, max-age=86400";
    ~\.bin$    "public, max-age=86400";
}

# Uma leitura serve a todos que estão olhando: o número de visitantes não vira carga no Prometheus.
proxy_cache_path /tmp/pulse-cache keys_zone=pulse:1m max_size=2m inactive=2m use_temp_path=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/octet-stream image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $nasrace_cache always;

    # Resolve a cada pedido: se o nas-pulse ainda não subiu (boot depois de queda de luz), o
    # nginx sobe do mesmo jeito, e a tela mostra "sinal perdido" até ele aparecer.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # O domínio aceita http://, e a tela precisa de https:// para ler a memória do aparelho.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # O mesmo site responde em /nasrace/ (pelo túnel) e na raiz (dentro do servidor).
    rewrite ^/nasrace(/.*)$ $1 last;

    location = /nasrace {
        return 301 /nasrace/$is_args$args;
    }

    location = /api/pulse {
        limit_except GET {
            deny all;
        }
        # /api/race entrega só o que a tela mostra; o resto do nas-pulse fica na tailnet.
        set $pulse http://nas-pulse:9106/api/race;
        proxy_pass $pulse;
        proxy_connect_timeout 3s;
        proxy_read_timeout 7s;

        proxy_cache pulse;
        proxy_cache_key pulse;
        proxy_cache_valid 200 3s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        # O nas-pulse manda no-store, que impediria guardar. Para o navegador, vale o cabeçalho daqui.
        proxy_ignore_headers Cache-Control;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
