services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    # SEM publicacao de porta no host.
    #
    # O Prometheus nao tem autenticacao nenhuma: quem alcanca a porta le
    # todas as metricas, incluindo a versao exata do kernel. Publicado em
    # "9090:9090" ele ficava exposto a LAN inteira — e o UFW NAO protegia,
    # porque o Docker escreve suas regras de iptables antes das do UFW e
    # passa por cima delas (a porta 9090 nem estava liberada no UFW e
    # respondia normalmente de outra maquina da rede).
    #
    # Quem consome o Prometheus (Grafana e o servico de telemetria) chega
    # por nome na rede Docker, nao pela porta do host. Para abrir a UI
    # pontualmente:  docker compose port prometheus 9090
    expose:
      - "9090"
    volumes:
      - /data/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /data/monitoring/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    # Scrapeado pelo Prometheus por nome na rede Docker ("node-exporter:9100").
    # A porta no host nao era usada por nada.
    expose:
      - "9100"

  cadvisor:
    # v0.47.0 e de 2023 e nao acompanha o cgroup v2 deste kernel: o log
    # acumulou 486 mil "Failed to create existing container" e as series
    # saiam SEM o rotulo "name", que e justamente o que a telemetria do
    # portfolio usa para montar a constelacao.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    # Namespace de cgroup do host (equivale a --cgroupns=host).
    #
    # O Docker aqui cria cada container com cgroup namespace "private":
    # de dentro, o cAdvisor enxerga apenas o proprio cgroup como raiz e
    # nao alcanca /sys/fs/cgroup/system.slice/docker-<id>.scope dos
    # outros. Montar /sys nao resolve — o bloqueio e de namespace, nao
    # de caminho.
    cgroup: host
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # Mesma situacao do Prometheus: sem autenticacao, expunha detalhes de
    # todos os containers e do hardware para qualquer um na LAN.
    # Scrapeado por "cadvisor:8080" na rede Docker.
    expose:
      - "8080"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    # Bind explicito no gateway do Docker, e nao em 0.0.0.0: o unico
    # consumidor e o Cloudflare Tunnel, que alcanca 172.17.0.1:3000.
    # Mesmo padrao que draft (8090) e nasfinance (8092) ja usavam — eram
    # os unicos servicos inalcancaveis da LAN no teste.
    # Acesso remoto continua por grafana.ebls.com.br, atras do Access.
    ports:
      - "172.17.0.1:3000:3000"
    volumes:
      - /data/monitoring/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
